spring:
  application:
    name: ai-super-agent
  # 激活本地配置文件
  profiles:
    active: local
  # AI 相关配置
  ai:
    dashscope:
      # 注意这里的导入格式
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
      options:
        model: qwen-plus
      embedding:
        options:
          model: text-embedding-v2
      vectorstore:
        pgvector:
          index-type: HNSW
          distance-type: COSINE_DISTANCE
          max-document-batch-size: 10000 # Optional: Maximum number of documents per batch

    #   mcp配置
    mcp:
      client:
        enabled: true
        request-timeout: 60s
        stdio:
          servers-configuration: classpath:mcp-servers.json
          env:
            #                API_KEY: ${AMAP_API_KEY:}
            API_KEY: c5083e75c47469db84f0f8bc64e955e53cf5b9763f18db0e7992006c6e23a57b

          enabled: true
          name: my-mcp-client
          version: 1.0.0
          request-timeout: 30s
          type: SYNC
          sse:
            connections:
              server1:
                url: http://localhost:8080



  datasource:
    url: jdbc:postgresql://rm-cn-rfd4pkzs1000112o.rwlb.rds.aliyuncs.com:5432/PG_Vector_ai
    username: my_pgsql
    password: PGsql123123
    driver-class-name: org.postgresql.Driver

    #    MCP相关配置
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        sse:
          connections:
            server1:
              url: http://localhost:8080
        stdio:
          connections:
            server1:
              command: /path/to/server
              args:
                - --port=8080
              env:
                API_KEY: your-api-key

#服务器配置
server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lx.aisuperagent.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

#开启日志调试
logging:
  level:
    org.springframework.ai.chat.client.advisor: INFO
    org.springframework.jdbc: INFO

# searchApi
search-api:
  api-key: ${SERPAPI_API_KEY:}

