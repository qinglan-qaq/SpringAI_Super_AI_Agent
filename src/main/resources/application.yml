spring:
  application:
    name: ai-super-agent
  #    激活本地文件
  profiles:
    active: local
  ai:
    dashscope:
      #        注意这里的导入格式
#      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:your-api-key}
      api-key: sk-1579485902c84c5b83699923adb2a405
      options:
        model: qwen-plus
  #          开启日志调试
  logging:
    level:
      org.springframework.ai.chat.client.advisor: debug

  datasource:
    url: jdbc:postgresql://改为你的公网地址/yu_ai_agent
    username: 改为你的用户名
    password: 改为你的密码
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch


server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lx.aisuperagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai: INFO
    com.lx.aisuperagent.advisor.MyLoggerAdvisor: INFO

